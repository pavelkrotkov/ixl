name: Run IXL Stats Scraper

on:
  schedule:
    - cron: '59 23 * * *'  # Runs at 23:59 UTC every day
  pull_request:
    branches: [main]  # Triggers on PRs to main branch
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: read

jobs:
  scrape:
    # Dependabot PRs cannot access repository secrets, so the credential
    # check would always fail; a live scrape adds nothing to a dep bump.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Install dependencies
      run: uv sync --locked

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Check credentials
      run: uv run python check_credentials.py
      env:
        IXL_USERNAME: ${{ secrets.IXL_USERNAME }}
        IXL_PASSWORD: ${{ secrets.IXL_PASSWORD }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        MATHACADEMY_USERNAME: ${{ secrets.MATHACADEMY_USERNAME }}
        MATHACADEMY_PASSWORD: ${{ secrets.MATHACADEMY_PASSWORD }}
        MATHACADEMY_STUDENT_IDS: ${{ secrets.MATHACADEMY_STUDENT_IDS }}

    - name: Run IXL Stats Scraper
      env:
        IXL_USERNAME: ${{ secrets.IXL_USERNAME }}
        IXL_PASSWORD: ${{ secrets.IXL_PASSWORD }}
        HEADLESS: 'true'
        SEND_EMAIL: ${{ github.event_name == 'schedule' }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        MATHACADEMY_USERNAME: ${{ secrets.MATHACADEMY_USERNAME }}
        MATHACADEMY_PASSWORD: ${{ secrets.MATHACADEMY_PASSWORD }}
        MATHACADEMY_STUDENT_IDS: ${{ secrets.MATHACADEMY_STUDENT_IDS }}
      run: uv run python get_stats.py

    - name: Upload screenshot on failure
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: error-screenshot
        path: error_screenshot.png
