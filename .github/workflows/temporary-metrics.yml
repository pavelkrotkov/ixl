name: Temporary Metrics

on:
  push:
    branches: [issue-13-deep-architecture]

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - run: python -m pip install radon==6.0.1
      - run: radon cc -s get_stats.py ixl_parser.py progress.py report.py
      - run: radon mi -s get_stats.py ixl_parser.py progress.py report.py
